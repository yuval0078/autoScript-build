name: Apply safety source migration

on:
  push:
    branches:
      - agent/fix-launch-paths-and-version
    paths:
      - tools/apply_safety_fixes.py
      - .github/workflows/apply-safety-fixes.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-launch-paths-and-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic replacements
        run: python tools/apply_safety_fixes.py

      - name: Commit migrated source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui_menu.py exp_initializer.py audio_processor.py TouchpadExperiment.spec
          if git diff --cached --quiet; then
            echo "No source changes were needed."
          else
            git commit -m "Use safe ZIP extraction and unique temp files"
            git push origin HEAD:agent/fix-launch-paths-and-version
          fi
