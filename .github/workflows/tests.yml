name: Focused tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run focused unit tests
        run: python -m unittest discover -s tests -v

  inspect-portable-recovery:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure LFS archive is downloaded
        run: git lfs pull

      - name: Extract and compare recoverable source files
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import difflib
          import hashlib
          import json
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd()
          archive = repo / "portable build" / "TouchpadExperiment_Portable_20260125.zip"
          output = repo / "recovery_output"
          recovered_out = output / "recovered_source"
          current_out = output / "current_source"
          diff_out = output / "diffs"
          for directory in (recovered_out, current_out, diff_out):
              directory.mkdir(parents=True, exist_ok=True)

          if not archive.is_file():
              raise SystemExit(f"Archive not found: {archive}")
          if archive.read_bytes()[:80].startswith(b"version https://git-lfs.github.com/spec"):
              raise SystemExit("The ZIP is still an LFS pointer; git lfs pull did not download it")

          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          recovered = {}
          with zipfile.ZipFile(archive) as zf:
              for entry in zf.infolist():
                  normalized = entry.filename.replace("\\", "/")
                  marker = "TouchpadExperiment/_internal/"
                  if marker not in normalized or not normalized.endswith(".py"):
                      continue
                  relative = normalized.split(marker, 1)[1]
                  if "/" in relative:
                      continue
                  name = PurePosixPath(relative).name
                  data = zf.read(entry)
                  recovered[name] = data
                  (recovered_out / name).write_bytes(data)

          summary = []
          for name, recovered_bytes in sorted(recovered.items()):
              root_file = repo / name
              current_bytes = root_file.read_bytes() if root_file.is_file() else b""
              if root_file.is_file():
                  shutil.copy2(root_file, current_out / name)

              recovered_text = recovered_bytes.decode("utf-8", errors="replace").splitlines(keepends=True)
              current_text = current_bytes.decode("utf-8", errors="replace").splitlines(keepends=True)
              patch = "".join(difflib.unified_diff(
                  current_text,
                  recovered_text,
                  fromfile=f"current/{name}",
                  tofile=f"portable/{name}",
              ))
              (diff_out / f"{name}.diff").write_text(patch, encoding="utf-8")

              additions = sum(1 for line in patch.splitlines() if line.startswith("+") and not line.startswith("+++"))
              deletions = sum(1 for line in patch.splitlines() if line.startswith("-") and not line.startswith("---"))
              summary.append({
                  "name": name,
                  "recovered_size": len(recovered_bytes),
                  "current_size": len(current_bytes),
                  "recovered_sha256": sha256_bytes(recovered_bytes),
                  "current_sha256": sha256_bytes(current_bytes) if current_bytes else None,
                  "matches_current": recovered_bytes == current_bytes,
                  "diff_additions_portable": additions,
                  "diff_deletions_portable": deletions,
              })

          (output / "comparison.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )
          report = [
              f"Archive size: {archive.stat().st_size}",
              f"Recovered source files: {len(summary)}",
              "",
          ]
          for item in summary:
              report.append(
                  f"{item['name']}: matches_current={item['matches_current']} "
                  f"portable_additions={item['diff_additions_portable']} "
                  f"portable_deletions={item['diff_deletions_portable']}"
              )
          (output / "comparison-report.txt").write_text("\n".join(report) + "\n", encoding="utf-8")
          print("\n".join(report))
          PY

      - name: Upload compact recovery comparison
        uses: actions/upload-artifact@v4
        with:
          name: portable-1.0.3-comparison
          path: recovery_output
          if-no-files-found: error
          retention-days: 7
