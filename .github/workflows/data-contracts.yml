name: Data contract checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  current-output-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify schemas match current emitters
        run: python -m unittest tests.test_data_contract_schemas -v
