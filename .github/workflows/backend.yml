name: Backend checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v

  docker-integration:
    name: PostgreSQL, MinIO and desktop-client smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install smoke-client dependencies
        run: python -m pip install "jsonschema>=4.23,<5"

      - name: Build and start the complete API stack
        run: docker compose -f backend/compose.yml up -d --build --wait

      - name: Verify migrations have no model drift
        working-directory: backend
        run: docker compose -f compose.yml exec -T api alembic check

      - name: Exercise the API through the desktop client
        env:
          AUTOSCRIPT_API_URL: http://127.0.0.1:8000
        run: python backend/scripts/smoke_experiment_api.py

      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f backend/compose.yml logs --no-color

      - name: Stop the ephemeral stack
        if: always()
        run: docker compose -f backend/compose.yml down --volumes --remove-orphans
