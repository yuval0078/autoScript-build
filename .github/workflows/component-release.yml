name: Independent component builds

on:
  pull_request:
    branches:
      - main
    paths:
      - "*.py"
      - "component_versions.json"
      - "requirements.txt"
      - "packaging/**"
      - "scripts/build_components.ps1"
      - "tests/**"
      - ".github/workflows/component-release.yml"
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: "Create a draft GitHub Release containing the verified ZIPs"
        required: true
        type: boolean
        default: false

jobs:
  build-component:
    name: Build ${{ matrix.component }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - interface
          - builder
          - runner
          - analyzer
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip wheel "setuptools==80.10.1"
          python -m pip install --only-binary :all: -r requirements.txt
          python -m pip install "jsonschema>=4.23,<5"

      - name: Stage FFmpeg for Builder and Runner
        if: matrix.component == 'builder' || matrix.component == 'runner'
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress
          $tools = Join-Path $env:ChocolateyInstall "lib\ffmpeg\tools"
          $ffmpeg = Get-ChildItem $tools -Recurse -File -Filter ffmpeg.exe |
            Where-Object { $_.Length -gt 1MB } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $ffmpeg) { throw "Could not locate ffmpeg.exe" }
          $ffprobe = Join-Path $ffmpeg.DirectoryName "ffprobe.exe"
          if (-not (Test-Path -LiteralPath $ffprobe)) { throw "Could not locate ffprobe.exe" }
          New-Item -ItemType Directory -Force -Path "assets\bin" | Out-Null
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination "assets\bin\ffmpeg.exe" -Force
          Copy-Item -LiteralPath $ffprobe -Destination "assets\bin\ffprobe.exe" -Force

      - name: Run component-focused tests
        shell: powershell
        run: |
          $tests = switch ("${{ matrix.component }}") {
            "interface" { @("tests.test_builder_process_separation", "tests.test_component_updates", "tests.test_component_update_ui", "tests.test_component_packaging", "tests.test_experiment_packages") }
            "builder"   { @("tests.test_builder_workspace", "tests.test_data_contract_schemas") }
            "runner"    { @("tests.test_calibration_input", "tests.test_result_upload_queue", "tests.test_runner_analyzer_block_identity", "tests.test_runner_recovery_contracts") }
            "analyzer"  { @("tests.test_experiment_results", "tests.test_data_contract_fixtures") }
          }
          python -m unittest @tests -v
          if ($LASTEXITCODE -ne 0) { throw "Component tests failed" }

      - name: Build isolated component archive
        shell: powershell
        run: |
          .\scripts\build_components.ps1 `
            -Components "${{ matrix.component }}" `
            -OutputDirectory "component-artifacts"

      - name: Verify archive and checksum exist
        shell: powershell
        run: |
          $manifest = Get-Content "component-artifacts\component-artifacts.json" -Raw | ConvertFrom-Json
          $entry = $manifest.components."${{ matrix.component }}"
          $archive = Join-Path "component-artifacts" $entry.filename
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Missing component ZIP" }
          if (-not (Test-Path -LiteralPath "$archive.sha256" -PathType Leaf)) { throw "Missing checksum" }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $entry.sha256) { throw "Component checksum mismatch" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            if ($entry.entrypoint -notin $names) { throw "Missing signed component entrypoint" }
            if ("component.json" -notin $names) { throw "Missing archive-root component descriptor" }
            $foreign = @(
              "AutoScriptInterface.exe", "Builder.exe", "ExperimentRunner.exe", "Analyzer.exe" |
                Where-Object { $_ -ne $entry.entrypoint -and $_ -in $names }
            )
            if ($foreign.Count -gt 0) { throw "Foreign component executables: $($foreign -join ', ')" }
            $descriptorEntry = $zip.GetEntry("component.json")
            $reader = [System.IO.StreamReader]::new($descriptorEntry.Open())
            try { $descriptor = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            $descriptorFields = @($descriptor.PSObject.Properties.Name | Sort-Object)
            $expectedFields = @(
              "arch", "entrypoint", "format_version", "id", "platform",
              "protocol_version", "source_commit", "version"
            ) | Sort-Object
            if (($descriptorFields -join ',') -ne ($expectedFields -join ',')) {
              throw "Unexpected component descriptor fields"
            }
            if ($descriptor.id -ne "${{ matrix.component }}" -or
                $descriptor.version -ne $entry.version -or
                $descriptor.entrypoint -ne $entry.entrypoint -or
                $descriptor.protocol_version -ne $entry.protocol) {
              throw "Component descriptor does not match artifact manifest"
            }
          }
          finally { $zip.Dispose() }

          if ("${{ matrix.component }}" -eq "interface") {
            $bootstrap = Join-Path "component-artifacts" $manifest.bootstrap.filename
            if (-not (Test-Path -LiteralPath $bootstrap -PathType Leaf)) { throw "Missing bootstrap ZIP" }
            $bootstrapZip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $bootstrap))
            try {
              $bootstrapNames = @($bootstrapZip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
              foreach ($required in @("AutoScriptLauncher.exe", "AutoScriptInterface.exe", "bootstrap.json", "component.json")) {
                if ($required -notin $bootstrapNames) { throw "Bootstrap missing $required" }
              }
              foreach ($forbidden in @("Builder.exe", "ExperimentRunner.exe", "Analyzer.exe")) {
                if ($forbidden -in $bootstrapNames) { throw "Bootstrap contains $forbidden" }
              }
            }
            finally { $bootstrapZip.Dispose() }
          }

      - name: Upload verified component artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoscript-${{ matrix.component }}
          path: component-artifacts/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create opt-in draft release
    needs:
      - build-component
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft_release == true
    runs-on: windows-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out catalog tooling and pinned trust key
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalog signing dependency
        run: python -m pip install "cryptography>=43.0.0"

      - name: Download verified component artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: autoscript-*
          path: release-assets

      - name: Attest component and bootstrap archives
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "release-assets/**/*.zip"

      - name: Create signed update catalog
        id: catalog
        shell: powershell
        env:
          AUTOSCRIPT_UPDATE_SIGNING_KEY: ${{ secrets.AUTOSCRIPT_UPDATE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUTOSCRIPT_UPDATE_SIGNING_KEY)) {
            throw "Repository secret AUTOSCRIPT_UPDATE_SIGNING_KEY is required for a draft release"
          }
          $tag = "components-r$env:GITHUB_RUN_NUMBER"
          python scripts/create_signed_update_catalog.py `
            --artifacts-root release-assets `
            --repository $env:GITHUB_REPOSITORY `
            --tag $tag `
            --sequence $env:GITHUB_RUN_NUMBER `
            --trust update_trust.json `
            --output-directory release-assets/catalog
          if ($LASTEXITCODE -ne 0) { throw "Catalog signing failed" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create draft release without publishing or moving existing tags
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.catalog.outputs.tag }}"
          $existingReleases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing releases" }
          if ($existingReleases | Where-Object { $_.tagName -eq $tag }) {
            throw "Release tag $tag already exists"
          }
          $assets = @(
            Get-ChildItem "release-assets" -Recurse -File |
              Where-Object {
                $_.Name -match "\.(zip|sha256)$" -or
                $_.Name -in @("autoscript-update-catalog.json", "autoscript-update-catalog.json.sig")
              } |
              Select-Object -ExpandProperty FullName
          )
          if ($assets.Count -ne 12) {
            throw "Expected four component ZIPs, one bootstrap ZIP, checksums, catalog, and signature"
          }
          gh release create $tag @assets `
            --draft `
            --target $env:GITHUB_SHA `
            --title "AutoScript component builds $tag" `
            --notes "Draft only. Promote through the signed update-catalog workflow after review."
          if ($LASTEXITCODE -ne 0) { throw "Could not create draft release" }
