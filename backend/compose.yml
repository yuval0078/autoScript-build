services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoscript}
      POSTGRES_USER: ${POSTGRES_USER:-autoscript}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-autoscript}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      AUTOSCRIPT_ENVIRONMENT: development
      AUTOSCRIPT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autoscript}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-autoscript}
      AUTOSCRIPT_MINIO_ENDPOINT: minio:9000
      AUTOSCRIPT_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-autoscript}
      AUTOSCRIPT_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      AUTOSCRIPT_MINIO_BUCKET: autoscript-artifacts
      AUTOSCRIPT_MINIO_SECURE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
